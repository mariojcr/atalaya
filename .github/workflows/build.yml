# Every push and pull request: formatting, lints and tests of both crates. From main, the images
# ghcr.io/<owner>/atalaya-server and atalaya-collector are pushed as `main` and `sha-<7>`. A version
# tag on main (`v0.2.0`, created by `cz bump`, or a pre-release such as `v0.2.0-rc.1`) also pushes
# them as `0.2.0`, `0.2`, `0` (from 1.0) and `latest` (pre-releases only as their version), and
# publishes a GitHub Release with that version's notes from CHANGELOG.md. See docs/releasing.md.
name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  test:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.tag.outputs.version }}
      prerelease: ${{ steps.tag.outputs.prerelease }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # the whole history: the tag check needs main
          fetch-depth: 0
          persist-credentials: false
      # A release tag is a version, on main, and the version both crates carry
      - name: Release tag
        id: tag
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          set -euo pipefail
          tag=${GITHUB_REF#refs/tags/}
          [[ $tag =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z]+(\.[0-9A-Za-z]+)*)?$ ]] \
            || { echo "::error::not a release tag: $tag"; exit 1; }
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main \
            || { echo "::error::$tag is not on main"; exit 1; }
          grep -qx "version = \"${tag#v}\"" Cargo.toml \
            || { echo "::error::Cargo.toml is not at ${tag#v}"; exit 1; }
          echo "version=${tag#v}" >> "$GITHUB_OUTPUT"
          if [[ $tag == *-* ]]; then pre=true; else pre=false; fi
          echo "prerelease=$pre" >> "$GITHUB_OUTPUT"
      # rustup installs the toolchain of rust-toolchain.toml on the first cargo call
      - name: Format
        run: cargo fmt --all --check
      - name: Lint
        run: cargo clippy --release --all-targets --locked -- -D warnings
      - name: Test
        run: cargo test --release --locked

  image:
    needs: test
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Both images from the Dockerfile anyone can build, checked before they are pushed: if a
      # binary does not start here, nothing is published
      - name: Build
        run: |
          set -euo pipefail
          image=ghcr.io/${GITHUB_REPOSITORY,,}
          sha=sha-${GITHUB_SHA::7}
          for c in server collector; do
            docker build --pull --target "$c" \
              --label "org.opencontainers.image.source=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" \
              -t "$image-$c:$sha" .
          done
          # The output is read whole before grep: with pipefail, `grep -q` closing the pipe early
          # would fail the step. The collector without a config prints its usage and exits 1.
          out=$(docker run --rm "$image-server:$sha" schema)
          grep -q "CREATE TABLE" <<<"$out"
          out=$(docker run --rm "$image-collector:$sha" 2>&1 || true)
          grep -q "usage: atalaya-collector" <<<"$out"
          docker run --rm --entrypoint smartctl "$image-collector:$sha" --version >/dev/null
      - name: Push
        env:
          TOKEN: ${{ github.token }}
          VERSION: ${{ needs.test.outputs.version }}
          PRERELEASE: ${{ needs.test.outputs.prerelease }}
        run: |
          set -euo pipefail
          image=ghcr.io/${GITHUB_REPOSITORY,,}
          sha=sha-${GITHUB_SHA::7}
          printf '%s' "$TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          tags=("$sha")
          # main only from main, and a version only from its checked tag
          if [ "$GITHUB_REF" = refs/heads/main ]; then tags+=(main); fi
          if [ -n "$VERSION" ]; then
            tags+=("$VERSION")
            if [ "$PRERELEASE" = false ]; then
              tags+=("${VERSION%.*}" latest)
              case "$VERSION" in 0.*) ;; *) tags+=("${VERSION%%.*}") ;; esac
            fi
          fi
          for c in server collector; do
            for t in "${tags[@]}"; do
              docker tag "$image-$c:$sha" "$image-$c:$t"
              docker push -q "$image-$c:$t"
            done
          done

  release:
    needs: [test, image]
    if: needs.test.outputs.version != ''
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.test.outputs.version }}
          PRERELEASE: ${{ needs.test.outputs.prerelease }}
        run: |
          set -euo pipefail
          tag=v$VERSION
          # the section of this version in CHANGELOG.md (written by cz bump)
          awk -v v="$VERSION" '$0 ~ "^## v?"v"( |$)" {on=1; next} on && /^## / {exit} on' CHANGELOG.md > notes.md 2>/dev/null || true
          [ -s notes.md ] || echo "Release $tag" > notes.md
          # a re-run leaves the release it already made
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then exit 0; fi
          flags=(--verify-tag --title "$tag" --notes-file notes.md)
          if [ "$PRERELEASE" = true ]; then flags+=(--prerelease); fi
          gh release create "$tag" --repo "$GITHUB_REPOSITORY" "${flags[@]}"
