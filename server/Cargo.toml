[package]
name = "atalaya-server"
description = "atalaya server and UI: metrics (PromQL and Cloud Monitoring style), logs, dashboards and alerts on ClickHouse"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true

[lib]
name = "atalaya"
path = "src/lib.rs"

[[bin]]
name = "atalaya-server"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
axum = "0.8"
base64 = "0.23.1"
chrono.workspace = true
form_urlencoded = "1.2.2"
getrandom = "0.4.3"
hmac = "0.13"
futures.workspace = true
promql-parser = "0.11.0"
regex.workspace = true
reqwest.workspace = true
serde.workspace = true
serde-saphyr.workspace = true
serde_json.workspace = true
sha2 = "0.11.0"
tokio.workspace = true
tower-http = { version = "0.7.1", features = ["compression-gzip", "compression-br"] }
tracing.workspace = true
tracing-subscriber.workspace = true
xxhash-rust.workspace = true
